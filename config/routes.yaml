# Routes voor de route_manager (RouteManagerServer -> get_route -> MissionManagerNode).
# Waypoints in het map-frame: x, y in meter, yaw in radialen (rijrichting bij aankomst).
# Starten: ros2 service call /start_route my_bot_interfaces/srv/StartRoute "{route_name: gang_a}"
# Nieuwe route klikken: poses publiceren op route_draft/add_pose en opslaan met
#   ros2 service call /route_draft/save my_bot_interfaces/srv/SaveRoute "{name: mijn_route}"
# (zie StartenSImulatie.md). Opslaan herschrijft dit bestand; commentaar bovenaan blijft staan.
# hospital_robot_bringup sim.launch.py gebruikt dit bestand direct (geen build nodig).

routes:
  gang_a:
    map_id: ziekenhuis
    waypoints:
    - {name: gang_a_1, x: 3.19, y: 0.21, yaw: 0.0}
    - {name: gang_a_2, x: 5.48, y: -0.6, yaw: -0.8}
  heen_en_terug:
    map_id: ziekenhuis
    waypoints:
    - {name: keerpunt, x: 3.19, y: 0.21, yaw: 3.14}
    - {name: start, x: 0.35, y: 0.16, yaw: 0.0}
  gang_b:
    map_id: ziekenhuis
    waypoints:
    - {name: gang_b_1, x: 1.1529207562805777, y: -3.2469335736542497, yaw: 0.0}
    - {name: gang_b_2, x: 3.684189956116658, y: -0.7990212624594655, yaw: 0.1566122863249712}
    - {name: gang_b_3, x: 1.1050901988740947, y: 2.250042672438627, yaw: 1.4349058199114064}
